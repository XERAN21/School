<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>従業員一覧</title>
	<style>
		body {
			font-family: sans-serif;
			margin: 40px;
		}

		.container {
			width: 98%;
		}

		.notice-area {
			text-align: center;
			color: #2c5d63;
			font-weight: bold;
			margin: 10px 0;
			padding: 10px;
		}

		table {
			border-collapse: collapse;
			width: 100%;
			margin-top: 20px;
		}

		th,
		td {
			border: 1px solid #ccc;
			padding: 8px;
			text-align: left;
		}

		th {
			background-color: #f2f2f2;
		}

		.header-area {
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.action-area {
			margin-top: 20px;
			text-align: right;
		}

		.btn-group {
			display: flex;
			gap: 5px;
		}
	</style>
</head>

<body>
	<header class>
		<div th:replace="~{common/header :: header}"></div>
	</header>
	<div class="container">
		<h2>従業員一覧</h2>
		<div class="notice-area" th:if="${notice}" th:text="${notice}"></div>
		<div class="action-area" th:if="${session.loginUser.adminFlg == 1}">
			<a th:href="@{/employees/{deptId}/new(deptId=${deptId})}">従業員登録</a>
		</div>

		<table th:if="${not #lists.isEmpty(emps)}">
			<thead>
				<th>社員番号</th>
				<th>氏名</th>
				<th>入社日</th>
				<th>部署</th>
				<th th:if="${session.loginUser.adminFlg == 1}">編集</th>
				<th th:if="${session.loginUser.adminFlg == 1}">削除</th>
			</thead>
			<tbody>
				<tr th:each="emp : ${emps}">
					<td th:text="${emp.enumber}"></td>
					<td><a th:href="@{/employees/{id}/detail(id=${emp.id})}" th:text="${emp.ename}"></a></td>
					<td th:text="${emp.hireDate}"></td>
					<td th:text="${emp.dname}"></td>
					<td th:if="${session.loginUser.adminFlg == 1}">
						<form method="get" th:action="@{/employees/{id}/edit(id=${emp.id})}">
							<button type="submit">編集</button>
						</form>
					</td>
					<td th:if="${session.loginUser.adminFlg == 1}">
						<form method="post" onsubmit="return confirm('本当に削除しますか？');">
							<button type="submit">削除</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>

		<div th:if="${#lists.isEmpty(emps)}" class="error">
			<p>従業員見つかりません。</p>
		</div>

		<a th:href="@{/depts}">部署一覧</a>

	</div>
</body>

</html>
