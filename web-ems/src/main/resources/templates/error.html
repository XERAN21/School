<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>システムエラー</title>
	<link rel="stylesheet" th:href="@{/css/common/themes.css}">
	<style>
		body {
			font-family: sans-serif;
			margin: 40px;
			line-height: 1.6;
			background: var(--lightest-color);
		}

		.error-box {
			margin-top: 30px;
			padding: 20px;
			max-width: 600px;
			background: var(--light-color);
			border-radius: 8px;
		}

		h1 {
			color: var(--delete);
			margin-top: 0;
		}

		.info {
			background-color: var(--lightest-color);
			padding: 10px;
			font-size: 0.9rem;
			border-radius: 4px;
		}

		.btn-link {
			display: inline-block;
			margin-top: 20px;
			padding: 10px 20px;
			background-color: var(--brand-color);
			color: var(--lightest-color);
			text-decoration: none;
			border-radius: 4px;
			font-weight: bold;
			transition: all 0.3s ease;
		}

		.btn-link:hover {
			background-color: var(--dark-color);
		}
	</style>
</head>

<body>
	<header class>
		<div th:replace="~{common/header :: header}"></div>
	</header>
	<div class="error-box">
		<h1 th:text="'Error ' + ${status}"></h1>
		<p>問題が発生しました。再度お試しいただくか管理者へご連絡ください。</p>

		<div class="info">
			<strong>詳細情報:</strong><br>
			・Error: <span th:text="${error}"></span><br>
			・Message: <span th:text="${message}"></span><br>
			・Path: <span th:text="${path}"></span>
		</div>

		<a th:href="@{/login}" class="btn-link">ログイン画面へ戻る</a>
	</div>

</body>

</html>
