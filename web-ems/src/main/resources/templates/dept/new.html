<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>部署登録</title>
	<style>
		body {
			font-family: sans-serif;
			margin: 40px;
		}

		.form-container {
			width: 400px;
		}

		.form-group {
			margin-bottom: 15px;
		}

		label {
			display: block;
			font-size: 0.9rem;
			margin-bottom: 5px;
		}

		input,
		textarea {
			width: 100%;
			padding: 8px;
			box-sizing: border-box;
		}

		.btn-area {
			margin-top: 20px;
			display: flex;
			gap: 10px;
		}

		.error {
			color: red;
			font-size: 0.8rem;
		}
	</style>
</head>

<body>
	<header class>
		<div th:replace="~{common/header :: header}"></div>
	</header>
	<div class="form-container">
		<h2>部署新規登録</h2>

		<form th:action="@{/depts/new}" th:object="${deptForm}" method="post">
			<div class="form-group">
				<label>部署名</label>
				<input type="text" th:field="*{dname}" />
				<div class="error" th:if="${#fields.hasErrors('dname')}" th:errors="*{dname}"></div>
			</div>

			<div class="form-group">
				<label>備考</label>
				<textarea th:field="*{description}" rows="4"></textarea>
				<div class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
			</div>

			<div class="btn-area">
				<button type="submit">登録</button>
				<a th:href="@{/depts}">キャンセル</a>
			</div>
		</form>
	</div>

</body>

</html>
