<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>部署一覧</title>
	<link rel="stylesheet" th:href="@{/css/dept/list.css}">
</head>

<body>
	<header class>
		<div th:replace="~{common/header :: header}"></div>
	</header>
	<div class="container">
		<div class="head">
			<svg width="50" height="40" fill="var(--brand-color)" viewBox="0 0 24 24">
				<path
					d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z" />
			</svg>
			<h2>部署一覧</h2>
		</div>


		<div class="notice-area" th:if="${notice}" th:text="${notice}"></div>
		<div class="action-area" th:if="${session.loginUser.adminFlg == 1}">
			<a th:href="@{/depts/new}">部署登録</a>
		</div>

		<table>
			<thead>
				<tr>
					<th>ID</th>
					<th>部署名</th>
					<th>詳細</th>
					<th th:if="${session.loginUser.adminFlg == 1}">編集</th>
					<th th:if="${session.loginUser.adminFlg == 1}">削除</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="dept : ${depts}">
					<td th:text="${dept.id}">1</td>
					<td><a th:href="@{/employees/{id}(id=${dept.id})}"><span th:text="${dept.dname}"></a></td>
					<td>
						<form th:action="@{/depts/{id}/detail(id=${dept.id})}" method="get">
							<button type="submit">詳細</button>
						</form>
					</td>
					<td th:if="${session.loginUser.adminFlg == 1}">
						<form th:action="@{/depts/{id}/edit(id=${dept.id})}" method="get">
							<button type="submit">編集</button>
						</form>
					</td>
					<td th:if="${session.loginUser.adminFlg == 1}">
						<form th:action="@{/depts/{id}/delete(id=${dept.id})}" method="post"
							onsubmit="return confirm('本当に削除しますか？');">
							<button type="submit">削除</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>
	</div>
</body>

</html>
